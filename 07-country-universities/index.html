<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Universities by Country</title>
<style>body{font-family:Arial;margin:30px;background:#f0f9ff}.content-box{max-width:850px;margin:auto;background:white;padding:24px;border-radius:12px}input,button{padding:11px;font-size:16px}button{background:#0369a1;color:white;border:0;border-radius:5px}li{padding:10px;border-bottom:1px solid #ddd}a{color:#0369a1}</style></head><body><main class="content-box"><h1>Find Universities</h1><form id="findForm"><input id="countryBox" placeholder="Country e.g. India" required><button>Search</button></form><p id="infoText"></p><ul id="uniList"></ul></main>
<script>
const form=document.querySelector("#findForm"),country=document.querySelector("#countryBox"),results=document.querySelector("#uniList"),status=document.querySelector("#infoText");
form.onsubmit=async e=>{e.preventDefault();results.innerHTML="";status.textContent="Loading...";try{const url=`https://universities.hipolabs.com/search?country=${encodeURIComponent(country.value.trim())}`;const res=await fetch(url);if(!res.ok)throw new Error("Request failed");const data=await res.json();status.textContent=`Found ${data.length} universities.`;data.forEach(u=>{const li=document.createElement("li");const a=document.createElement("a");a.href=u.web_pages[0]||"#";a.textContent=u.name;a.target="_blank";a.rel="noopener";li.append(a,document.createTextNode(` — State: ${u["state-province"]||"Not available"}`));results.append(li)});if(!data.length)status.textContent="No universities found."}catch(err){status.textContent="Unable to fetch data. Check your internet connection."}};
</script></body></html>
