<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dynamic Chessboard</title>
<style>body{font-family:Arial;display:grid;place-items:center;min-height:100vh;background:#f1f5f9}.board-grid{display:grid;grid-template-columns:repeat(8, min(10vw,65px));grid-template-rows:repeat(8,min(10vw,65px));border:5px solid #0c4a6e}.sq{display:grid;place-items:center;font-size:clamp(22px,5vw,42px)}.pale-sq{background:#e0f2fe}.deep-sq{background:#0369a1}</style></head><body><div><h2>Chessboard (UI only)</h2><div class="board-grid" id="boardGrid"></div></div>
<script>
const board=document.querySelector("#boardGrid");
const pieces=[["♜","♞","♝","♛","♚","♝","♞","♜"],Array(8).fill("♟"),...Array.from({length:4},()=>Array(8).fill("")),Array(8).fill("♙"),["♖","♘","♗","♕","♔","♗","♘","♖"]];
pieces.forEach((row,r)=>row.forEach((piece,c)=>{const square=document.createElement("div");square.className=`sq ${(r+c)%2?"deep-sq":"pale-sq"}`;square.textContent=piece;board.append(square)}));
</script></body></html>
