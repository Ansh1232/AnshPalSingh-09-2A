<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>To-do List</title>
<style>
body{font-family:Arial;background:#fff7ed;display:grid;place-items:start center;padding:35px}
main{background:white;padding:24px;border-radius:12px;width:min(600px,100%);box-shadow:0 5px 20px #0001}
form{display:flex;gap:8px}input{flex:1;padding:11px}button{padding:9px 12px;cursor:pointer;border:0;border-radius:6px;background:#ea580c;color:white;margin:2px}
li{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #eee}li span{flex:1}.finished{text-decoration:line-through;color:#888}
</style></head><body><main><h1>My To-do List</h1><form id="addForm"><input id="taskInput" placeholder="Enter a task..." required><button>Add</button></form><ul id="todoItems"></ul></main>
<script>
const form=document.querySelector("#addForm"),input=document.querySelector("#taskInput"),list=document.querySelector("#todoItems");
let tasks=[];
function render(){list.innerHTML="";tasks.forEach((task,index)=>{const li=document.createElement("li");
const check=document.createElement("input");check.type="checkbox";check.checked=task.done;check.onchange=()=>{task.done=check.checked;render()};
const label=document.createElement("span");label.textContent=task.text;if(task.done)label.className="finished";
const del=document.createElement("button");del.textContent="Delete";del.onclick=()=>{tasks.splice(index,1);render()};
const up=document.createElement("button");up.textContent="↑";up.disabled=index===0;up.onclick=()=>{[tasks[index-1],tasks[index]]=[tasks[index],tasks[index-1]];render()};
const down=document.createElement("button");down.textContent="↓";down.disabled=index===tasks.length-1;down.onclick=()=>{[tasks[index+1],tasks[index]]=[tasks[index],tasks[index+1]];render()};
li.append(check,label,up,down,del);list.append(li);});}
form.onsubmit=e=>{e.preventDefault();tasks.push({text:input.value.trim(),done:false});input.value="";render()};
</script></body></html>
