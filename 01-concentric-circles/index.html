<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentric Circles</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff1f2;font-family:Arial}
.disc{border-radius:50%;display:grid;place-items:center}
.disc-outer{width:60px;height:60px;background:#e11d48}
.disc-middle{width:40px;height:40px;background:#fde047}
.disc-inner{width:20px;height:20px;background:#0f172a}
</style></head>
<body><div class="disc disc-outer"><div class="disc disc-middle"><div class="disc disc-inner"></div></div></div></body>
</html>
