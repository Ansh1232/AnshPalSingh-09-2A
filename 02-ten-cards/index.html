<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ten Cards</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;padding:24px;background:#eff6ff}
.card-row{display:flex;gap:16px;overflow-x:auto;padding:10px}
.tile-card{flex:0 0 230px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #0002}
.tile-card img{width:100%;height:140px;object-fit:cover}.card-info{padding:14px}.card-info h3{margin:0 0 8px;color:#1d4ed8}.card-info p{color:#475569;line-height:1.4;margin:0}
</style></head><body><h1>Featured Cards</h1><div class="card-row" id="cardRow"></div>
<script>
const cards=Array.from({length:10},(_,i)=>({title:`Card ${i+1}`,description:`This is a short description for card ${i+1}.`}));
document.querySelector("#cardRow").innerHTML=cards.map((c,i)=>`
<article class="tile-card"><img src="https://picsum.photos/seed/scene${i+1}/500/300" alt="${c.title}">
<div class="card-info"><h3>${c.title}</h3><p>${c.description}</p></div></article>`).join("");
</script></body></html>
